services:
  - type: web
    name: newtonite-ops-demo
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NEWTONITE_DB
        value: /tmp/newtonite.db
